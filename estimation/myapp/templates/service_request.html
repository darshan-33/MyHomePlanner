{% load static %}
{% include 'user_header.html'%}
<hr>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Post Your Request</h2>
  {% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
{% endif %}

  <hr class="border border-primary border-2 opacity-50 mb-4">

    <form method="POST" class="p-4 border rounded bg-light">
  {% csrf_token %}
  <div class="mb-3">
    <label for="message" class="form-label">Message</label>
    <textarea class="form-control" id="Message" name="message" required>
    </textarea>
  </div>


  <button type="submit" class="btn btn-primary">Post Request</button>
</form>


</div>
{% include 'footer.html' %}
