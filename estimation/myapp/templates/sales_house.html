{% load static %}
{% include 'contractor_header.html' %}

  <style>


    .card {
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      background-color: white;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-primary {
      background-color: #89253e;
      border: none;
    }

    .btn-primary:hover {
      background-color: #6a1d32;
    }
  </style>
</head>
<body>
<hr class="mb-4">
<div class="container mt-5">
  <h2 class="mb-4">Add House for Sale</h2>
  <h4 class="text-success"> {{msg}}</h4>
  <form method="POST" enctype="multipart/form-data" class="row g-3">
    {% csrf_token %}

    <div class="col-md-6">
      <label for="house_type" class="form-label">House Type</label>
      <input type="text" class="form-control" name="house_type" id="house_type" required>
    </div>

    <div class="col-md-6">
      <label for="area" class="form-label">Area</label>
      <input type="text" class="form-control" name="area" id="area" required>
    </div>

    <div class="col-md-6">
      <label for="city" class="form-label">City</label>
      <input type="text" class="form-control" name="city" id="city" required>
    </div>

    <div class="col-md-6">
      <label for="address" class="form-label">Address</label>
      <input type="text" class="form-control" name="address" id="address" required>
    </div>

    <div class="col-12">
      <label for="facilities" class="form-label">Facilities</label>
      <textarea class="form-control" name="facilities" id="facilities" rows="3" maxlength="200" required></textarea>
    </div>

    <div class="col-md-6">
      <label for="cost" class="form-label">Cost (in ₹)</label>
      <input type="number" class="form-control" name="cost" id="cost" required>
    </div>

    <div class="col-md-6">
      <label for="photo" class="form-label">Photo</label>
      <input type="file" multiple  class="form-control" name="images" id="images" accept="image/*" required>
    </div>

    <div class="col-md-6">
      <label for="sale_status" class="form-label">Sale Status</label>
      <select class="form-select" name="sale_status" id="sale_status">
        <option value="available" selected>Available</option>
        <option value="sold">Sold</option>
      </select>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary">Submit</button>
    </div>
  </form>
</div>


{% include 'footer.html' %}
