{% load static %}
{% include 'admin_header.html' %}

  <style>


    .card {
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      background-color: white;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-primary {
      background-color: #89253e;
      border: none;
    }

    .btn-primary:hover {
      background-color: #6a1d32;
    }
  </style>
</head>
<hr>
<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">Add Raw Material Price</h3>
    <hr class="mb-4">

    {% if success %}
      <div class="alert alert-success text-center">
        {{ success }}
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="row mb-3">
        <div class="col-md-6">
          <label  class="form-label">Raw Material name</label>
          <input type="text" class="form-control" name="material_name" required>
        </div>
        <div class="col-md-6">
          <label  class="form-label">Company Name</label>
          <input type="text" class="form-control" name="company_name" id="company_name" required>
        </div>
      </div>

      <div class="mb-3">
        <label  class="form-label">UoM</label>
        <input type="text" class="form-control" name="uom"  required>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label  class="form-label">Cost</label>
          <input type="number" class="form-control" name="cost"  required>
        </div>

        <div class="col-md-6">
          <label  class="form-label">Size</label>
          <input type="text" class="form-control" name="size" id="size" required>
        </div>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
 </div>
  </div>
</div>


{% include 'footer.html' %}
