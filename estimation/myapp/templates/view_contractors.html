{% load static %}
{% include 'user_header.html'%}
<style>
.image-3d {
  width: 200px;
  transition: transform 0.5s ease, box-shadow 0.5s ease;
  transform-style: preserve-3d;
  border-radius: 10px;
  cursor: pointer;
}
.image-3d:hover {
  transform: scale(1.2) rotateY(15deg) rotateX(5deg);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  z-index: 10;
}
</style>


<hr>

<div class="container mt-4">
    <h2>Contractor Info</h2>
    <div class="row">
        {% for item in data %}
        <div class="col-md-3 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ item.contractor_name }}</h5>
                    <p class="card-text">
                        <strong>Experience:</strong> {{ item.experience }}<br>
                           <strong>address:</strong> ₹{{ item.address }}
                        <br>
                           <strong>Mobile No:</strong> ₹{{ item.contact }}
                    </p>
                </div>
                <div class="card-footer">
                    <div class="d-flex flex-wrap">
                      <img src="{{ item.document.url }}" class="img-thumbnail me-2 image-3d">

                        <a href="{% url 'service_request' item.id %}" class="text-white"> <button class="btn btn-success mt-3"> Book service</button> </a>
                    </div>

                </div>
            </div>
        </div>
        {% empty %}
        <p>No Records Found.</p>
        {% endfor %}
    </div>
</div>
{% include 'footer.html' %}
