{% load static %}
{% include 'admin_header.html' %}

  <style>


    .card {
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      background-color: white;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-primary {
      background-color: #89253e;
      border: none;
    }

    .btn-primary:hover {
      background-color: #6a1d32;
    }
  </style>
</head>
<body>
<hr class="mb-4">
<div class="container mt-3">
  <div class="row justify-content-center">
    <div class="card p-4 shadow-sm" style="max-width: 700px;">

      <h3 class="text-center mb-2">Contractor Registration</h3>
      <hr class="border border-primary border-2 opacity-50 mb-4">

      {% if success %}
        <div class="alert alert-success text-center">
          {{ success }}
        </div>
      {% endif %}

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- 👇 First row with two columns -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="contractor_name" class="form-label">Contractor Name</label>
            <input type="text" class="form-control" name="contractor_name" id="contractor_name" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="experience" class="form-label">Experience (Years)</label>
            <input type="text" class="form-control" name="experience" id="experience" required>
          </div>
        </div>

        <!-- 👇 Rest of the form fields -->
        <div class="mb-3">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" name="city" id="city" required>
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" class="form-control" name="address" id="address" required>
        </div>

        <div class="mb-3">
          <label for="contact" class="form-label">Contact</label>
          <input type="text" class="form-control" name="contact" id="contact" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" name="email" id="email" required>
        </div>

        <div class="mb-3">
          <label for="document" class="form-label">Upload Photo</label>
          <input type="file" class="form-control" name="document" id="document" required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Register Contractor</button>
        </div>
      </form>
    </div>
  </div>
</div>


{% include 'footer.html' %}
