<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Econo-Build</title>
  
  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 15px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-label {
      font-weight: 500;
      color: #495057;
      font-size: 0.9rem;
    }

    .input-group-text {
      background-color: #f8f9fa;
      border-right: none;
      color: #6c757d;
      border-radius: 8px 0 0 8px;
    }

    .form-control {
      border-left: none;
      border-radius: 0 8px 8px 0;
      padding: 10px 14px;
      transition: all 0.2s ease-in-out;
    }

    /* Keep proper focus highlighting on segmented input fields */
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control {
      border-color: #2575fc;
    }
    
    .input-group:focus-within .input-group-text {
      box-shadow: 0 0 0 4px rgba(37, 117, 252, 0.15);
    }

    .btn-submit {
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      background: linear-gradient(135deg, #2575fc 0%, #1a5bd0 100%);
      border: none;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1a5bd0 0%, #11429f 100%);
      box-shadow: 0 4px 12px rgba(37, 117, 252, 0.3);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .action-links {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center mb-2">
        <i class="bi bi-tools fs-2 text-primary me-2"></i>
        <h3 class="fw-bold text-dark mb-0 text-uppercase tracking-wider">Econo-Build</h3>
      </div>
      <p class="text-muted small">Welcome back! Please enter your credentials.</p>
    </div>

    <!-- Dynamic Error Feedback Block -->
    {% if error %}
      <div class="alert alert-danger d-flex align-items-center rounded-3 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div class="small">{{ error }}</div>
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      
      <!-- Email Input Group -->
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" id="email" placeholder="name@example.com" required>
        </div>
      </div>
      
      <!-- Password Input Group -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <!-- Remember Me & Forgot Password Utilities Row -->
      <div class="d-flex justify-content-between align-items-center action-links mb-4">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label text-muted" for="rememberMe">
            Remember me
          </label>
        </div>
        <a href="#" class="text-decoration-none fw-semibold text-primary">Forgot Password?</a>
      </div>

      <!-- Action Submission Button -->
      <button type="submit" class="btn btn-primary btn-submit w-100 text-uppercase tracking-wider">Sign In</button>
      
      <div class="text-center mt-4">
        <span class="text-muted small">Don't have an account yet? </span>
        <a href="{% url 'reg' %}" class="text-decoration-none small fw-bold text-primary">Register Here</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
