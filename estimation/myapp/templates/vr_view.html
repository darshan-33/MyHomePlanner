{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>VR House View</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>body { margin: 0; }</style>
</head>
<body>

<a-scene background="color: #ECECEC">

  <!-- Assets -->
  <a-assets>
    <a-asset-item id="houseModel" src="{% static 'vr_models/' %}{{ model_type }}"></a-asset-item>
  </a-assets>

  <!-- Lighting -->
  <a-entity light="type: ambient; intensity: 0.8"></a-entity>
  <a-entity light="type: directional; intensity: 1" position="2 5 2"></a-entity>

  <!-- Floor -->
  <a-plane rotation="-90 0 0" width="100" height="100" color="#ccc"></a-plane>

  <!-- Camera -->
  <a-entity position="0 1.6 8">
    <a-camera wasd-controls look-controls></a-camera>
  </a-entity>

  {% if bhk_type == "2BHK"%}
  <a-entity id="houseModelEntity"
          gltf-model="#houseModel"
          scale="0.01 0.01 0.01"
          position="0 0 0"
          rotation="0 180 0"
          animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 20000">
</a-entity>
  {%endif%}

    {% if bhk_type == "3BHK"%}
  <a-entity id="houseModelEntity"
          gltf-model="#houseModel"
          scale="0.80 0.82 0.83"
          position="0 0 0"
          rotation="0 180 0"
          animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 20000">
</a-entity>
  {%endif%}


    {% if bhk_type == "1BHK"%}
  <a-entity id="houseModelEntity"
          gltf-model="#houseModel"
          scale="0.84 0.50 0.90"
          position="0 0 0"
          rotation="0 180 0"
          animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 20000">
</a-entity>
  {%endif%}

  <script>
    // Debug model load
    document.querySelector('#houseModelEntity').addEventListener('model-loaded', () => {
      console.log('Model loaded successfully.');
    });

    AFRAME.registerComponent('hover-rotate', {
      init: function () {
        let el = this.el;
        el.addEventListener('mouseenter', () => {
          el.setAttribute('animation__hover', {
            property: 'rotation',
            to: '0 720 0',
            dur: 2000,
            easing: 'easeInOutQuad'
          });
        });
        el.addEventListener('mouseleave', () => {
          el.removeAttribute('animation__hover');
        });
      }
    });

    document.querySelector('#houseModelEntity').setAttribute('hover-rotate', '');
  </script>

</a-scene>

</body>
</html>
