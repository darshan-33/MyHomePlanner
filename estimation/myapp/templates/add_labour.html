{% load static %}
{% include 'admin_header.html' %}

  <style>


    .card {
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      background-color: white;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-primary {
      background-color: #89253e;
      border: none;
    }

    .btn-primary:hover {
      background-color: #6a1d32;
    }
  </style>
</head>
<hr>
<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">Labour Registration</h3>
    <hr class="mb-4">

    {% if success %}
      <div class="alert alert-success text-center">
        {{ success }}
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="labour_head" class="form-label">Labour Head</label>
          <input type="text" class="form-control" name="labour_head" id="labour_head" required>
        </div>
        <div class="col-md-6">
          <label for="city" class="form-label">City</label>
          <input type="text" class="form-control" name="city" id="city" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" class="form-control" name="address" id="address" required>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="number_of_workers" class="form-label">Number of Workers</label>
          <input type="number" class="form-control" name="number_of_workers" id="number_of_workers" required>
        </div>
        <div class="col-md-6">
          <label for="mobile_no" class="form-label">Mobile No</label>
          <input type="text" class="form-control" name="mobile_no" id="mobile_no" required>
        </div>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Register Labour</button>
      </div>
    </form>
 </div>
  </div>
</div>


{% include 'footer.html' %}
