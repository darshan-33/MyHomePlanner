<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration - Econo-Build</title>
  
  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .register-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 15px 40px 15px; /* Added spacing for fixed navbar */
    }

    .register-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 650px;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-label {
      font-weight: 500;
      color: #495057;
      font-size: 0.9rem;
    }

    .form-control {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus {
      border-color: #2575fc;
      box-shadow: 0 0 0 4px rgba(37, 117, 252, 0.15);
    }

    .btn-submit {
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      background: linear-gradient(135deg, #2575fc 0%, #1a5bd0 100%);
      border: none;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1a5bd0 0%, #11429f 100%);
      box-shadow: 0 4px 12px rgba(37, 117, 252, 0.3);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- 🌐 Header Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-uppercase tracking-wider" href="#">
        <i class="bi bi-tools me-2 text-warning"></i>My Home Planner
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-2">
          <li class="nav-item">
            <a class="nav-link px-3" href="{% url 'index' %}"><i class="bi bi-house-door me-1"></i>Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3 active bg-secondary bg-opacity-25 rounded" href="{% url 'login' %}"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 🧾 Registration Form Container -->
  <div class="register-container">
    <div class="register-card">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-dark mb-1">Create Account</h2>
        <p class="text-muted small">Join Econo-Build today to manage your operations seamlessly.</p>
      </div>

      <!-- System Feedback Alerts -->
      {% if error %}
        <div class="alert alert-danger d-flex align-items-center rounded-3 mb-4" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <div>{{ error }}</div>
        </div>
      {% endif %}

      {% if success %}
        <div class="alert alert-success d-flex align-items-center rounded-3 mb-4" role="alert">
          <i class="bi bi-check-circle-fill me-2"></i>
          <div>{{ success }}</div>
        </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <!-- Row 1: Name Fields -->
        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" name="first_name" id="first_name" class="form-control" placeholder="John" required>
          </div>
          <div class="col-sm-6">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" name="last_name" id="last_name" class="form-control" placeholder="Doe" required>
          </div>
        </div>

        <!-- Row 2: Contact & Email -->
        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
          </div>
          <div class="col-sm-6">
            <label for="contact" class="form-label">Contact Number</label>
            <input type="tel" name="contact" id="contact" class="form-control" placeholder="+1 (555) 000-0000" required>
          </div>
        </div>

        <!-- Row 3: Full Address Full-width -->
        <div class="mb-3">
          <label for="address" class="form-label">Street Address</label>
          <input type="text" name="address" id="address" class="form-control" placeholder="123 Main St, Apt 4B" required>
        </div>

        <!-- Row 4: City & Pincode -->
        <div class="row g-3 mb-4">
          <div class="col-sm-7">
            <label for="city" class="form-label">City</label>
            <input type="text" name="city" id="city" class="form-control" placeholder="New York" required>
          </div>
          <div class="col-sm-5">
            <label for="pincode" class="form-label">Pincode / ZIP</label>
            <input type="number" name="pincode" id="pincode" class="form-control" placeholder="10001" required>
          </div>
        </div>

        <hr class="text-muted opacity-25 my-4">

        <!-- Row 5: Password Fields -->
        <div class="row g-3 mb-4">
          <div class="col-sm-6">
            <label for="password1" class="form-label">Password</label>
            <input type="password" name="password1" id="password1" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="col-sm-6">
            <label for="password2" class="form-label">Confirm Password</label>
            <input type="password" name="password2" id="password2" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <!-- Form Submission -->
        <button type="submit" class="btn btn-primary btn-submit w-100 text-uppercase tracking-wider">Register Account</button>
        
        <div class="text-center mt-3">
          <span class="text-muted small">Already have an account? </span>
          <a href="{% url 'login' %}" class="text-decoration-none small fw-bold text-primary">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
